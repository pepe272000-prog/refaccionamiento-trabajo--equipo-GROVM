<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Refaccionamiento de Flota — III Servicios</title>
<style>
:root{
  --bg-primary:#f4f6f8; --bg-card:#ffffff; --bg-header:#1f4e78;
  --text-primary:#1f2937; --text-secondary:#6c757d; --text-on-dark:#ffffff;
  --positive:#1e8e3e; --warning:#e6a700; --negative:#c62828;
  --gap:16px; --radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg-primary);color:var(--text-primary);line-height:1.5;}
.container{max-width:1200px;margin:0 auto;padding:16px;}
header{background:var(--bg-header);color:var(--text-on-dark);padding:18px 22px;border-radius:var(--radius);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
header h1{font-size:19px;font-weight:600;}
header p{font-size:12px;opacity:.85;margin-top:3px;}
.tabs{display:flex;gap:8px;margin-bottom:16px;}
.tab-btn{padding:10px 18px;border:none;border-radius:8px;background:#e2e6ea;color:var(--text-secondary);font-weight:600;font-size:13px;cursor:pointer;}
.tab-btn.active{background:var(--bg-header);color:#fff;}
.panel{display:none;}
.panel.active{display:block;}
.card{background:var(--bg-card);border-radius:var(--radius);padding:20px 24px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:16px;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
.field label{display:block;font-size:12px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;font-weight:600;}
.field input, .field select, .field textarea{width:100%;padding:9px 11px;border:1px solid #d7dbe0;border-radius:7px;font-size:14px;font-family:inherit;}
.field textarea{resize:vertical;min-height:60px;}
.field.hidden{display:none;}
.submit-row{margin-top:18px;display:flex;align-items:center;gap:12px;}
.btn{background:var(--bg-header);color:#fff;border:none;padding:11px 22px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;}
.btn:hover{opacity:.92;}
.btn.secondary{background:#e2e6ea;color:var(--text-primary);}
.status-msg{font-size:13px;font-weight:600;}
.status-msg.ok{color:var(--positive);}
.status-msg.err{color:var(--negative);}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px;}
.kpi-card{background:var(--bg-card);border-radius:var(--radius);padding:16px 20px;box-shadow:0 1px 3px rgba(0,0,0,.08);border-left:4px solid var(--bg-header);}
.kpi-card.warn{border-left-color:var(--warning);}
.kpi-card.bad{border-left-color:var(--negative);}
.kpi-label{font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;}
.kpi-value{font-size:26px;font-weight:700;}
.filters{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.filters select{padding:7px 10px;border:1px solid #d7dbe0;border-radius:7px;font-size:13px;}
.unit-group{border:1px solid #e5e7eb;border-radius:8px;margin-bottom:10px;overflow:hidden;}
.unit-group summary{list-style:none;cursor:pointer;padding:10px 14px;background:#f8f9fa;display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:13px;}
.unit-group summary::-webkit-details-marker{display:none;}
.unit-group summary .pmx{font-weight:700;font-size:14px;}
.unit-group summary .tad-tag{font-size:11px;color:var(--text-secondary);background:#e9ecef;padding:2px 8px;border-radius:10px;}
.unit-body{padding:0 14px 12px;}
.data-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.data-table thead th{text-align:left;padding:8px 9px;border-bottom:2px solid #dee2e6;color:var(--text-secondary);font-weight:600;font-size:11px;text-transform:uppercase;}
.data-table tbody td{padding:7px 9px;border-bottom:1px solid #f0f0f0;}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;}
.badge-green{background:#d4edda;color:#1e7e34;}
.badge-yellow{background:#fff3cd;color:#8a6500;}
.badge-red{background:#f8d7da;color:#a71d2a;}
.badge-gray{background:#e2e3e5;color:#41464b;}
.mini-btn{padding:4px 10px;font-size:11px;border-radius:6px;border:none;background:var(--positive);color:#fff;cursor:pointer;}
.mini-btn.secondary{background:#e2e6ea;color:var(--text-primary);}
.mini-btn:disabled{opacity:.6;cursor:default;}
.inline-form{background:#f4f6f8;padding:10px;border-radius:7px;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;}
.inline-form .mini-field{display:flex;flex-direction:column;gap:3px;}
.inline-form .mini-field label{font-size:10px;color:var(--text-secondary);text-transform:uppercase;}
.inline-form .mini-field input, .inline-form .mini-field select{padding:5px 7px;font-size:12px;border:1px solid #d7dbe0;border-radius:5px;min-width:130px;}
.motivo-badge{cursor:pointer;}
.link-badge{font-size:11px;color:var(--bg-header);text-decoration:underline;}
.bulk-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#eaf2fb;border-top:1px solid #d7e3ef;font-size:12px;}
.bulk-bar .count{font-weight:600;color:var(--bg-header);}
.row-check{width:16px;height:16px;}
.empty-msg{color:var(--text-secondary);font-size:13px;padding:20px;text-align:center;}
.loading{color:var(--text-secondary);font-size:13px;padding:20px;text-align:center;}
footer{text-align:center;font-size:11px;color:var(--text-secondary);padding:14px 0;}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>Refaccionamiento de Flota — III Servicios</h1>
      <p>Meta: surtido el mismo día del pedido</p>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="reportar" onclick="showTab('reportar')">+ Reportar refacción</button>
      <button class="tab-btn" data-tab="avance" onclick="showTab('avance')">Avance / Dashboard</button>
    </div>
  </header>

  <section id="panel-reportar" class="panel active">
    <div class="card">
      <div class="form-grid">
        <div class="field">
          <label>Tu nombre (supervisor)</label>
          <input list="lista-supervisores" id="f-supervisor" placeholder="Escribe o elige tu nombre">
          <datalist id="lista-supervisores"></datalist>
        </div>
        <div class="field">
          <label>TAD</label>
          <select id="f-tad" onchange="onTadChange()">
            <option value="">Selecciona...</option>
            <option>AÑIL</option>
            <option>BARRANCA</option>
            <option>SAN JUAN</option>
            <option>18 DE MARZO</option>
          </select>
        </div>
        <div class="field hidden" id="field-proyecto">
          <label>Proyecto (solo 18 de Marzo)</label>
          <select id="f-proyecto" onchange="onProyectoChange()">
            <option value="">Selecciona...</option>
            <option value="ATTIS">Traspasos (ATTIS)</option>
            <option value="UM">Última milla (UM)</option>
          </select>
        </div>
        <div class="field">
          <label>PMX (autotanque)</label>
          <input list="lista-pmx" id="f-pmx" placeholder="Ej. PMX20162">
          <datalist id="lista-pmx"></datalist>
        </div>
        <div class="field">
          <label>Flota</label>
          <input id="f-flota" placeholder="UM / TIS" value="UM">
        </div>
        <div class="field" style="grid-column:1/-1;">
          <label>Refacción faltante</label>
          <input list="lista-refacciones" id="f-descripcion" placeholder="Escribe o elige de la lista">
          <datalist id="lista-refacciones"></datalist>
        </div>
        <div class="field">
          <label>Cantidad</label>
          <input type="number" id="f-cantidad" min="0" step="1">
        </div>
        <div class="field">
          <label>Unidad</label>
          <select id="f-unidad">
            <option>pza</option>
            <option>L</option>
            <option>servicio</option>
            <option>juego</option>
            <option>kit</option>
            <option>envase</option>
          </select>
        </div>
        <div class="field">
          <label>Prioridad</label>
          <select id="f-prioridad">
            <option>MEDIA</option>
            <option>ALTA</option>
            <option>BAJA</option>
          </select>
        </div>
        <div class="field" style="grid-column:1/-1;">
          <label>Observaciones (opcional)</label>
          <textarea id="f-observaciones"></textarea>
        </div>
      </div>
      <div class="submit-row">
        <button class="btn" onclick="enviarRefaccion()">Registrar refacción</button>
        <span class="status-msg" id="submit-status"></span>
      </div>
    </div>
  </section>

  <section id="panel-avance" class="panel">
    <div class="kpi-row" id="kpi-row"></div>
    <div class="card">
      <div class="filters">
        <select id="filtro-tad" onchange="renderAvance()"><option value="all">Todos los TAD</option></select>
        <select id="filtro-estatus" onchange="renderAvance()"><option value="all">Todos los estatus</option></select>
        <button class="btn secondary" onclick="cargarDatos()">↻ Actualizar</button>
      </div>
      <div id="avance-wrap"><div class="loading">Cargando datos del Sheet...</div></div>
    </div>
  </section>
  <datalist id="lista-quien-surte"></datalist>

  <footer>Datos en vivo desde Google Sheets · Se actualiza cada vez que abres esta página</footer>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxcjCxyTk-agcxaE8nlYRnaPx6i4I1rMEMYdb0Avb0vvk-vg3zvf7zo2b15ATW8eW9QOw/exec";
let ALL_ROWS = [];
let CATALOGO = [];

function showTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.getElementById('panel-reportar').classList.toggle('active', tab==='reportar');
  document.getElementById('panel-avance').classList.toggle('active', tab==='avance');
  if(tab==='avance') cargarDatos();
}

function onTadChange(){
  const tad = document.getElementById('f-tad').value;
  const proyectoField = document.getElementById('field-proyecto');
  if(tad === '18 DE MARZO'){
    proyectoField.classList.remove('hidden');
  } else {
    proyectoField.classList.add('hidden');
    document.getElementById('f-proyecto').value = '';
    document.getElementById('f-flota').value = 'UM';
  }
}
function onProyectoChange(){
  const p = document.getElementById('f-proyecto').value;
  document.getElementById('f-flota').value = p === 'ATTIS' ? 'TIS' : (p === 'UM' ? 'UM' : '');
}

async function cargarDatos(){
  try{
    const res = await fetch(SCRIPT_URL, {method:'GET'});
    const json = await res.json();
    ALL_ROWS = json.rows || [];
    CATALOGO = json.catalogo || [];
    poblarDatalists();
    renderAvance();
  }catch(err){
    document.getElementById('avance-wrap').innerHTML = '<div class="empty-msg">No se pudo cargar el Sheet. Verifica tu conexión o que la Apps Script siga desplegada. (' + err + ')</div>';
  }
}

const MOTIVOS = ["Falta de refacción con proveedor","Trámite administrativo","Retraso logístico","Otro"];

function poblarDatalists(){
  const supervisores = [...new Set(ALL_ROWS.map(r=>r.Supervisor).filter(Boolean))].sort();
  const pmxs = [...new Set(ALL_ROWS.map(r=>r.PMX).filter(Boolean))].sort();
  const quienSurte = [...new Set(ALL_ROWS.map(r=>r.QuienSurte).filter(Boolean))].sort();
  document.getElementById('lista-supervisores').innerHTML = supervisores.map(s=>`<option value="${s}">`).join('');
  document.getElementById('lista-pmx').innerHTML = pmxs.map(p=>`<option value="${p}">`).join('');
  document.getElementById('lista-refacciones').innerHTML = CATALOGO.map(c=>`<option value="${c}">`).join('');
  document.getElementById('lista-quien-surte').innerHTML = quienSurte.map(q=>`<option value="${q}">`).join('');

  const tads = [...new Set(ALL_ROWS.map(r=>r.TAD).filter(Boolean))].sort();
  const selTad = document.getElementById('filtro-tad');
  const currentTad = selTad.value;
  selTad.innerHTML = '<option value="all">Todos los TAD</option>' + tads.map(t=>`<option value="${t}">${t}</option>`).join('');
  selTad.value = currentTad || 'all';

  const estatuses = [...new Set(ALL_ROWS.map(r=>r.Estatus).filter(Boolean))].sort();
  const selE = document.getElementById('filtro-estatus');
  const currentE = selE.value;
  selE.innerHTML = '<option value="all">Todos los estatus</option>' + estatuses.map(e=>`<option value="${e}">${e}</option>`).join('');
  selE.value = currentE || 'all';
}

function diasRetraso(row){
  if(!row.Timestamp) return null;
  const pedido = new Date(row.Timestamp);
  if(row.Estatus === 'ENTREGADO' && row.FechaEntrega){
    const entrega = new Date(row.FechaEntrega);
    return Math.max(0, Math.round((entrega - pedido)/86400000));
  }
  const hoy = new Date();
  return Math.max(0, Math.round((hoy - pedido)/86400000));
}
function cumpleMismoDia(row){
  if(row.Estatus !== 'ENTREGADO' || !row.FechaEntrega) return 'NO';
  const pedido = new Date(row.Timestamp);
  const entrega = new Date(row.FechaEntrega);
  return Math.round((entrega-pedido)/86400000) === 0 ? 'SI' : 'NO';
}

async function enviarRefaccion(){
  const statusEl = document.getElementById('submit-status');
  const tad = document.getElementById('f-tad').value;
  const supervisor = document.getElementById('f-supervisor').value.trim();
  const pmx = document.getElementById('f-pmx').value.trim();
  const descripcion = document.getElementById('f-descripcion').value.trim();

  if(!supervisor || !tad || !pmx || !descripcion){
    statusEl.textContent = 'Falta: nombre, TAD, PMX o descripción de la refacción.';
    statusEl.className = 'status-msg err';
    return;
  }
  if(tad === '18 DE MARZO' && !document.getElementById('f-proyecto').value){
    statusEl.textContent = 'Selecciona el proyecto (ATTIS o UM) para 18 de Marzo.';
    statusEl.className = 'status-msg err';
    return;
  }

  const payload = {
    Supervisor: supervisor,
    TAD: tad,
    Proyecto: document.getElementById('f-proyecto').value,
    PMX: pmx,
    Flota: document.getElementById('f-flota').value,
    Descripcion: descripcion,
    Cantidad: document.getElementById('f-cantidad').value,
    Unidad: document.getElementById('f-unidad').value,
    Prioridad: document.getElementById('f-prioridad').value,
    Observaciones: document.getElementById('f-observaciones').value
  };

  statusEl.textContent = 'Enviando...';
  statusEl.className = 'status-msg';
  try{
    await fetch(SCRIPT_URL, {
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    statusEl.textContent = '✓ Refacción registrada correctamente.';
    statusEl.className = 'status-msg ok';
    document.getElementById('f-pmx').value = '';
    document.getElementById('f-descripcion').value = '';
    document.getElementById('f-cantidad').value = '';
    document.getElementById('f-observaciones').value = '';
    setTimeout(cargarDatos, 1200);
  }catch(err){
    statusEl.textContent = 'Error al enviar: ' + err;
    statusEl.className = 'status-msg err';
  }
}

function cerrarFormsAbiertos(){
  document.querySelectorAll('.inline-form-row').forEach(el=>el.remove());
}

function toggleMotivoForm(idx, ev){
  if(ev){ ev.preventDefault(); ev.stopPropagation(); }
  const existing = document.getElementById('motivo-row-'+idx);
  if(existing){ existing.remove(); return; }
  cerrarFormsAbiertos();
  const anchorRow = document.getElementById('row-'+idx);
  const tr = document.createElement('tr');
  tr.className = 'inline-form-row';
  tr.id = 'motivo-row-'+idx;
  const colCount = anchorRow.children.length;
  tr.innerHTML = `<td colspan="${colCount}"><div class="inline-form">
    <div class="mini-field"><label>Motivo del retraso</label>
      <select id="motivo-select-${idx}">
        <option value="">Selecciona...</option>
        ${MOTIVOS.map(m=>`<option value="${m}">${m}</option>`).join('')}
      </select>
    </div>
    <button type="button" class="mini-btn" onclick="guardarMotivo(${idx}, this)">Guardar motivo</button>
    <button type="button" class="mini-btn secondary" onclick="cerrarFormsAbiertos()">Cancelar</button>
  </div></td>`;
  anchorRow.after(tr);
}

async function guardarMotivo(idx, btn){
  const motivo = document.getElementById('motivo-select-'+idx).value;
  if(!motivo){ alert('Selecciona un motivo.'); return; }
  btn.disabled = true; btn.textContent = 'Guardando...';
  try{
    await fetch(SCRIPT_URL, {
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({accion:'actualizar_motivo', fila: idx+2, motivo: motivo})
    });
    setTimeout(cargarDatos, 1000);
  }catch(err){
    btn.disabled=false; btn.textContent='Error, reintentar';
    alert('No se pudo guardar el motivo: ' + err);
  }
}

function toggleEntregaForm(idxs, ev, anchorId){
  if(ev){ ev.preventDefault(); ev.stopPropagation(); }
  const idList = Array.isArray(idxs) ? idxs : [idxs];
  const formId = 'entrega-row-' + idList.join('-');
  const existing = document.getElementById(formId);
  if(existing){ existing.remove(); return; }
  cerrarFormsAbiertos();
  const anchorRow = document.getElementById(anchorId || ('row-'+idList[0]));
  const tr = document.createElement('tr');
  tr.className = 'inline-form-row';
  tr.id = formId;
  const colCount = anchorRow.children.length;
  const ahora = new Date();
  const horaDefault = ahora.toTimeString().slice(0,5);
  const etiqueta = idList.length > 1 ? `Se marcarán <b>${idList.length} refacciones</b> como entregadas con estos mismos datos:` : '';
  tr.innerHTML = `<td colspan="${colCount}"><div class="inline-form">
    ${etiqueta ? `<div style="width:100%;font-size:12px;color:var(--text-secondary);margin-bottom:4px;">${etiqueta}</div>` : ''}
    <div class="mini-field"><label>Quién surte</label>
      <input list="lista-quien-surte" id="quien-surte-g" placeholder="Nombre">
    </div>
    <div class="mini-field"><label>Hora de surtimiento</label>
      <input type="time" id="hora-surte-g" value="${horaDefault}">
    </div>
    <div class="mini-field"><label>Link de evidencia (opcional)</label>
      <input type="url" id="evidencia-g" placeholder="https://...">
    </div>
    <button type="button" class="mini-btn" onclick='confirmarEntregaLote(${JSON.stringify(idList)}, this)'>Confirmar entrega${idList.length>1 ? ' ('+idList.length+')' : ''}</button>
    <button type="button" class="mini-btn secondary" onclick="cerrarFormsAbiertos()">Cancelar</button>
  </div></td>`;
  anchorRow.after(tr);
}

async function confirmarEntregaLote(idList, btn){
  const quienSurte = document.getElementById('quien-surte-g').value.trim();
  const hora = document.getElementById('hora-surte-g').value;
  const link = document.getElementById('evidencia-g').value.trim();
  if(!quienSurte){ alert('Escribe quién surtió la refacción.'); return; }
  const hoy = new Date().toISOString().slice(0,10);
  btn.disabled = true; btn.textContent = 'Guardando...';
  try{
    for(const idx of idList){
      await fetch(SCRIPT_URL, {
        method:'POST', mode:'no-cors',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({accion:'actualizar_estatus', fila: idx+2, estatus:'ENTREGADO', fechaEntrega: hoy, quienSurte: quienSurte, horaSurtimiento: hora, evidenciaLink: link})
      });
    }
    setTimeout(cargarDatos, 1000);
  }catch(err){
    btn.disabled=false; btn.textContent='Error, reintentar';
    alert('No se pudo registrar la entrega: ' + err);
  }
}

function toggleSeleccion(groupId){
  const checks = document.querySelectorAll(`.row-check[data-group="${groupId}"]`);
  const selected = [...checks].filter(c=>c.checked).map(c=>Number(c.dataset.idx));
  const bar = document.getElementById('bulkbar-'+groupId);
  if(!bar) return;
  if(selected.length === 0){
    bar.style.display = 'none';
  } else {
    bar.style.display = 'flex';
    bar.querySelector('.count').textContent = selected.length + ' seleccionada(s)';
    bar.querySelector('.mini-btn').setAttribute('onclick', `toggleEntregaForm(${JSON.stringify(selected)}, event, 'bulkbar-${groupId}')`);
  }
}

function renderAvance(){
  const tadFiltro = document.getElementById('filtro-tad').value;
  const estatusFiltro = document.getElementById('filtro-estatus').value;
  let rows = ALL_ROWS.map((r,i)=>({...r, _idx:i, dias: diasRetraso(r), cumple: cumpleMismoDia(r)}));
  if(tadFiltro!=='all') rows = rows.filter(r=>r.TAD===tadFiltro);
  if(estatusFiltro!=='all') rows = rows.filter(r=>r.Estatus===estatusFiltro);

  const total = rows.length;
  const entregadasMismoDia = rows.filter(r=>r.cumple==='SI').length;
  const pctCumple = total ? (entregadasMismoDia/total*100) : 0;
  const abiertas = rows.filter(r=>r.Estatus!=='ENTREGADO');
  const avgRetraso = abiertas.length ? (abiertas.reduce((a,b)=>a+(b.dias||0),0)/abiertas.length) : 0;
  const criticas = rows.filter(r=>(r.dias||0)>=3 && r.Estatus!=='ENTREGADO').length;

  document.getElementById('kpi-row').innerHTML = `
    <div class="kpi-card"><div class="kpi-label">Total partidas</div><div class="kpi-value">${total}</div></div>
    <div class="kpi-card bad"><div class="kpi-label">% Cumplimiento mismo día</div><div class="kpi-value">${pctCumple.toFixed(1)}%</div></div>
    <div class="kpi-card warn"><div class="kpi-label">Prom. días retraso (abiertas)</div><div class="kpi-value">${avgRetraso.toFixed(1)}</div></div>
    <div class="kpi-card bad"><div class="kpi-label">Críticas (&ge;3 días)</div><div class="kpi-value">${criticas}</div></div>
  `;

  if(total===0){
    document.getElementById('avance-wrap').innerHTML = '<div class="empty-msg">No hay partidas registradas todavía (o no coinciden con el filtro).</div>';
    return;
  }

  const groups = {};
  rows.forEach(r=>{
    const key = r.TAD + '||' + r.PMX;
    if(!groups[key]) groups[key] = {tad:r.TAD, pmx:r.PMX, flota:r.Flota, items:[]};
    groups[key].items.push(r);
  });
  const groupList = Object.values(groups).map(g=>{
    const t = g.items.length;
    const ent = g.items.filter(x=>x.cumple==='SI').length;
    const maxRetraso = Math.max(...g.items.map(x=>x.dias||0));
    return {...g, total:t, entregadas:ent, maxRetraso};
  });
  groupList.sort((a,b)=> b.maxRetraso - a.maxRetraso || String(a.pmx).localeCompare(String(b.pmx)));

  let html = '';
  groupList.forEach((g,gi)=>{
    let cls='badge-green';
    if(g.maxRetraso>=3) cls='badge-red'; else if(g.maxRetraso>=1) cls='badge-yellow';
    const groupId = (g.tad+'_'+g.pmx).replace(/[^a-zA-Z0-9]/g,'');
    const pendientesGrupo = g.items.filter(x=>x.Estatus!=='ENTREGADO').length;
    html += `<details class="unit-group"${gi<3?' open':''}><summary>
      <span class="pmx">${g.pmx}</span>
      <span class="tad-tag">${g.tad}</span>
      <span>Flota: ${g.flota||'-'}</span>
      <span>${g.entregadas}/${g.total} entregadas</span>
      <span class="badge ${cls}">Máx. retraso: ${g.maxRetraso}d</span>
    </summary><div class="unit-body"><table class="data-table"><thead><tr>
      <th></th><th>Descripción</th><th>Cant.</th><th>Prioridad</th><th>Estatus</th><th>Días</th><th>Motivo</th><th>Reportó</th><th>Surtió / Evidencia</th><th></th>
    </tr></thead><tbody>`;
    g.items.sort((a,b)=>(b.dias||0)-(a.dias||0)).forEach(row=>{
      let dcls='badge-gray';
      if(row.dias===0) dcls='badge-green'; else if(row.dias<=2) dcls='badge-yellow'; else if(row.dias>=3) dcls='badge-red';

      let checkCell = '';
      let acciones;
      if(row.Estatus==='ENTREGADO'){
        acciones = '<span class="badge badge-green">Entregado</span>';
      } else {
        checkCell = `<input type="checkbox" class="row-check" data-group="${groupId}" data-idx="${row._idx}" onchange="toggleSeleccion('${groupId}')">`;
        acciones = `<button type="button" class="mini-btn" onclick="toggleEntregaForm(${row._idx}, event)">Marcar entregado</button>
          <button type="button" class="mini-btn secondary" onclick="toggleMotivoForm(${row._idx}, event)">Motivo de retraso</button>`;
      }

      const motivoCell = row.Motivo ? `<span class="badge badge-yellow">${row.Motivo}</span>` : '<span class="badge badge-gray">Sin especificar</span>';

      let surtioCell = '-';
      if(row.Estatus==='ENTREGADO'){
        surtioCell = (row.QuienSurte||'-') + (row.HoraSurtimiento ? ' · ' + row.HoraSurtimiento : '');
        if(row.EvidenciaLink){ surtioCell += ` · <a class="link-badge" href="${row.EvidenciaLink}" target="_blank">ver evidencia</a>`; }
      }

      html += `<tr id="row-${row._idx}"><td>${checkCell}</td><td>${row.Descripcion||'-'}</td><td>${row.Cantidad||'-'}</td><td>${row.Prioridad||'-'}</td><td>${row.Estatus||'-'}</td><td><span class="badge ${dcls}">${row.dias}</span></td><td>${motivoCell}</td><td>${row.Supervisor||'-'}</td><td>${surtioCell}</td><td>${acciones}</td></tr>`;
    });
    html += '</tbody></table>';
    if(pendientesGrupo > 1){
      html += `<div class="bulk-bar" id="bulkbar-${groupId}" style="display:none;">
        <span class="count">0 seleccionada(s)</span>
        <button type="button" class="mini-btn" onclick="">Marcar seleccionadas como entregadas</button>
        <button type="button" class="mini-btn secondary" onclick="document.querySelectorAll('.row-check[data-group=&quot;${groupId}&quot;]').forEach(c=>c.checked=false); toggleSeleccion('${groupId}');">Limpiar selección</button>
      </div>`;
    }
    html += '</div></details>';
  });
  document.getElementById('avance-wrap').innerHTML = html;
}

cargarDatos();
</script>
</body>
</html>
